name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-24.04
          - label: linux-arm64
            os: ubuntu-24.04-arm
          - label: macos-arm64
            os: macos-15
          - label: macos-x64
            os: macos-15-intel
          - label: windows-x64
            os: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJSXER_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install and package
        shell: bash
        run: |
          set -euo pipefail
          package_name="jsxer-${GITHUB_REF_NAME}-${{ matrix.label }}"
          cmake --install build --config Release --prefix "stage/${package_name}"
          mkdir -p artifacts
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            (cd stage && cmake -E tar cf "../artifacts/${package_name}.zip" --format=zip "${package_name}")
          else
            (cd stage && cmake -E tar czf "../artifacts/${package_name}.tar.gz" "${package_name}")
          fi

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" artifacts/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "Jsxer ${TAG}"
          fi
